<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Core Ranker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">

    <nav class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-widest text-red-500">CORE RANKER <span class="text-white font-light ml-2">| Admin Dashboard</span></h1>
            <div class="flex items-center gap-4">
                <span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full animate-pulse">Live Database</span>
                <button onclick="location.href='index.html'" class="text-gray-300 hover:text-white transition text-sm">Exit Admin</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-3 gap-8 mt-4">
        
        <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 class="text-xl font-black text-gray-800 mb-2 border-b pb-4">Bulk Question Uploader</h2>
                <p class="text-gray-500 text-sm mb-4 mt-4">Paste your JSON array here. Ensure all fields are formatted correctly before uploading.</p>
                
                <textarea id="json-input" rows="12" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:ring-2 focus:ring-blue-500 outline-none transition shadow-inner" placeholder='[\n  {\n    "subject": "GATE-MOCK-1",\n    "questionText": "Sample question?",\n    "options": ["A", "B", "C", "D"],\n    "correctIndex": 0\n  }\n]'></textarea>
                
                <button id="upload-btn" class="mt-4 bg-blue-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-blue-700 w-full transition shadow-lg hover:shadow-blue-200">Upload to Firestore</button>
                
                <div id="status-box" class="hidden mt-4 p-4 rounded-xl text-sm font-bold border"></div>
            </div>
        </div>

        <div class="lg:col-span-2 flex flex-col">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex-1 flex flex-col">
                <div class="flex justify-between items-center border-b pb-4 mb-4">
                    <h2 class="text-xl font-black text-gray-800">Database Viewer</h2>
                    <button id="refresh-btn" class="flex items-center text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-bold transition">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Refresh Data
                    </button>
                </div>

                <div class="overflow-x-auto border rounded-xl rounded-t-none flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="p-4 font-black">Subject</th>
                                <th class="p-4 font-black">Question Preview</th>
                                <th class="p-4 font-black text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="db-table-body" class="text-sm divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
                <div class="mt-4 text-xs text-gray-500 font-bold text-right" id="total-count">Total Questions: 0</div>
            </div>
        </div>
    </main>

    <div id="view-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col relative overflow-hidden">
            <div class="bg-slate-50 border-b p-6 flex justify-between items-center shrink-0">
                <h3 class="text-xl font-black text-gray-900">Question Overview</h3>
                <button onclick="closeViewModal()" class="text-gray-400 hover:text-red-500 transition bg-white rounded-full p-1 border shadow-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto flex-1 bg-white"></div>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col relative overflow-hidden">
            <div class="bg-blue-600 text-white border-b p-6 flex justify-between items-center shrink-0">
                <h3 class="text-xl font-black">Edit Question</h3>
                <button onclick="closeEditModal()" class="text-blue-200 hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 bg-gray-50 space-y-4">
                <input type="hidden" id="edit-id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Subject / Paper ID</label>
                    <input type="text" id="edit-subject" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Question Text</label>
                    <textarea id="edit-text" rows="3" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Image URL (Optional)</label>
                    <input type="text" id="edit-image" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://...">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Option A (Index 0)</label>
                        <input type="text" id="edit-opt-0" class="w-full p-3 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Option B (Index 1)</label>
                        <input type="text" id="edit-opt-1" class="w-full p-3 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Option C (Index 2)</label>
                        <input type="text" id="edit-opt-2" class="w-full p-3 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Option D (Index 3)</label>
                        <input type="text" id="edit-opt-3" class="w-full p-3 border rounded-lg outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Correct Answer Index (0, 1, 2, or 3)</label>
                    <select id="edit-correct" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                        <option value="0">0 (Option A)</option>
                        <option value="1">1 (Option B)</option>
                        <option value="2">2 (Option C)</option>
                        <option value="3">3 (Option D)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Detailed Explanation</label>
                    <textarea id="edit-explanation" rows="3" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>
            <div class="p-4 bg-white border-t shrink-0 flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-6 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg transition">Cancel</button>
                <button onclick="saveEdit()" id="save-edit-btn" class="px-8 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow transition">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        // Notice we imported "updateDoc" here!
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, initializeFirestore } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDENuRhO2xK9hZK43kFVHmbZR3rz6LHjAY",
            authDomain: "core-ranker.firebaseapp.com",
            projectId: "core-ranker",
            storageBucket: "core-ranker.firebasestorage.app",
            messagingSenderId: "13358547173",
            appId: "1:13358547173:web:fe232275125be8e884940c"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        const statusBox = document.getElementById('status-box');
        const tbody = document.getElementById('db-table-body');
        const uploadBtn = document.getElementById('upload-btn');
        window.allQuestionsData = {};

        // --- 1. LOAD DATA ---
        async function loadDatabase() {
            tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-blue-500 font-bold animate-pulse">Loading...</td></tr>`;
            try {
                const querySnapshot = await getDocs(collection(db, "questions"));
                tbody.innerHTML = "";
                window.allQuestionsData = {}; 
                let count = 0;
                
                querySnapshot.forEach((document) => {
                    count++;
                    const data = document.data();
                    const id = document.id; 
                    window.allQuestionsData[id] = data; 
                    
                    const safeText = data.questionText || "[Missing Text]";
                    const safeSubject = data.subject || "UNASSIGNED";
                    const shortText = safeText.length > 50 ? safeText.substring(0, 50) + "..." : safeText;

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4"><span class="bg-blue-100 text-blue-800 text-[10px] font-black px-2 py-1 rounded uppercase tracking-wider">${safeSubject}</span></td>
                            <td class="p-4 text-gray-800 font-medium">${shortText}</td>
                            <td class="p-4 text-right">
                                <div class="flex justify-end gap-2">
                                    <button onclick="viewQuestion('${id}')" class="text-blue-500 hover:bg-blue-100 p-2 rounded-lg transition" title="View">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                    </button>
                                    <button onclick="openEditModal('${id}')" class="text-amber-500 hover:bg-amber-100 p-2 rounded-lg transition" title="Edit">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    </button>
                                    <button onclick="deleteRow('${id}')" class="text-red-500 hover:bg-red-100 p-2 rounded-lg transition" title="Delete">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                if (count === 0) tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-400 font-bold">Database is empty.</td></tr>`;
                document.getElementById('total-count').innerText = `Total Questions: ${count}`;

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-red-500 font-bold">Failed to load data.</td></tr>`;
            }
        }

        // --- 2. EDIT LOGIC (NEW) ---
        window.openEditModal = (id) => {
            const q = window.allQuestionsData[id];
            if (!q) return;

            // Fill the form fields with existing data
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-subject').value = q.subject || "";
            document.getElementById('edit-text').value = q.questionText || "";
            document.getElementById('edit-image').value = q.imageUrl || "";
            
            // Handle options safely
            document.getElementById('edit-opt-0').value = q.options && q.options[0] ? q.options[0] : "";
            document.getElementById('edit-opt-1').value = q.options && q.options[1] ? q.options[1] : "";
            document.getElementById('edit-opt-2').value = q.options && q.options[2] ? q.options[2] : "";
            document.getElementById('edit-opt-3').value = q.options && q.options[3] ? q.options[3] : "";
            
            document.getElementById('edit-correct').value = q.correctIndex !== undefined ? q.correctIndex : 0;
            document.getElementById('edit-explanation').value = q.explanation || "";

            // Show the modal
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.saveEdit = async () => {
            const id = document.getElementById('edit-id').value;
            const btn = document.getElementById('save-edit-btn');
            btn.disabled = true; btn.innerText = "Saving...";

            // Gather options and remove any empty ones
            let newOptions = [
                document.getElementById('edit-opt-0').value,
                document.getElementById('edit-opt-1').value,
                document.getElementById('edit-opt-2').value,
                document.getElementById('edit-opt-3').value
            ].filter(opt => opt.trim() !== "");

            const updatedData = {
                subject: document.getElementById('edit-subject').value,
                questionText: document.getElementById('edit-text').value,
                imageUrl: document.getElementById('edit-image').value || "",
                options: newOptions,
                correctIndex: parseInt(document.getElementById('edit-correct').value),
                explanation: document.getElementById('edit-explanation').value
            };

            try {
                // Send update command to Firebase
                await updateDoc(doc(db, "questions", id), updatedData);
                document.getElementById('edit-modal').classList.add('hidden');
                loadDatabase(); // Refresh the table automatically
            } catch (error) {
                alert("Error saving: " + error.message);
            } finally {
                btn.disabled = false; btn.innerText = "Save Changes";
            }
        };

        window.closeEditModal = () => document.getElementById('edit-modal').classList.add('hidden');

        // --- 3. VIEW LOGIC ---
        window.viewQuestion = (id) => {
            const q = window.allQuestionsData[id];
            if (!q) return;
            let optionsHTML = "<p class='text-gray-400 text-sm italic'>No options provided.</p>";
            if (q.options && q.options.length > 0) {
                optionsHTML = q.options.map((opt, index) => {
                    const isCorrect = index == q.correctIndex;
                    return `<div class="p-3 rounded-lg border ${isCorrect ? 'border-green-400 bg-green-50' : 'border-gray-200 bg-white'} mb-2 flex items-center"><span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${isCorrect ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-600'}">${String.fromCharCode(65 + index)}</span><span class="${isCorrect ? 'font-bold text-green-900' : 'text-gray-700'}">${opt}</span>${isCorrect ? '<span class="ml-auto text-xs font-black text-green-600 uppercase">Correct</span>' : ''}</div>`;
                }).join("");
            }
            const imageHTML = (q.imageUrl && q.imageUrl.trim().length > 5) ? `<img src="${q.imageUrl}" class="mt-4 mb-6 max-w-full rounded-lg border border-gray-200 shadow-sm" onerror="this.style.display='none'">` : "";
            document.getElementById('modal-content').innerHTML = `<div class="mb-4"><span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded uppercase tracking-wider">${q.subject || 'UNASSIGNED'}</span></div><h4 class="text-xl font-bold text-gray-900 mb-2">${q.questionText || '[Missing Text]'}</h4>${imageHTML}<div class="mt-6 mb-2"><h5 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-3">Options Matrix</h5>${optionsHTML}</div>${q.explanation ? `<div class="mt-6 bg-blue-50 border border-blue-100 p-4 rounded-xl"><h5 class="text-xs font-black text-blue-600 uppercase tracking-widest mb-2">Explanation</h5><p class="text-gray-700 text-sm leading-relaxed">${q.explanation}</p></div>` : ''}`;
            document.getElementById('view-modal').classList.remove('hidden');
        };
        window.closeViewModal = () => document.getElementById('view-modal').classList.add('hidden');

        // --- 4. DELETE LOGIC ---
        window.deleteRow = async (id) => {
            if(confirm("Delete this question forever?")) {
                try { await deleteDoc(doc(db, "questions", id)); loadDatabase(); } 
                catch (error) { alert("Error deleting: " + error.message); }
            }
        };

        // --- 5. UPLOAD LOGIC ---
        uploadBtn.addEventListener('click', async () => {
            const input = document.getElementById('json-input').value;
            statusBox.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'bg-red-50', 'text-red-700');
            try {
                const questionsArray = JSON.parse(input);
                uploadBtn.disabled = true; uploadBtn.innerText = "Uploading...";
                let count = 0;
                for (const q of questionsArray) { await addDoc(collection(db, "questions"), q); count++; }
                statusBox.innerText = `✅ Successfully uploaded ${count} questions!`;
                statusBox.classList.add('bg-green-50', 'text-green-700');
                document.getElementById('json-input').value = ""; loadDatabase();
            } catch (error) {
                statusBox.innerText = "❌ Error: Invalid JSON format."; statusBox.classList.add('bg-red-50', 'text-red-700');
            } finally {
                uploadBtn.disabled = false; uploadBtn.innerText = "Upload to Firestore";
            }
        });

        document.getElementById('refresh-btn').addEventListener('click', loadDatabase);
        loadDatabase();
    </script>
</body>
</html>

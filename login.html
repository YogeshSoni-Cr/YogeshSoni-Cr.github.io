<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Core Ranker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-600 tracking-wider">Core Ranker</h1>
            <p class="text-gray-500 mt-2">Welcome back! Please login to your account.</p>
        </div>

        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email Address</label>
                <input type="email" id="email" name="email" placeholder="student@example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
                
                <div class="text-right mt-1">
                    <a href="#" class="text-sm text-blue-500 hover:text-blue-700">Forgot Password?</a>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                Sign In
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-gray-600">Don't have an account? <a href="signup.html" class="text-blue-600 font-semibold hover:underline">Sign up for free</a></p>
        </div>

        <div class="text-center mt-8">
            <a href="index.html" class="text-gray-400 hover:text-gray-600 text-sm">← Back to Home</a>
        </div>
        
    </div>

    <script type="module">
        // 1. Import Firebase tools
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 2. YOUR FIREBASE CONFIGURATION (Replace with your exact keys!)
        const firebaseConfig = {
            apiKey: "AIzaSyDENuRhO2xK9hZK43kFVHmbZR3rz6LHjAY",
            authDomain: "core-ranker.firebaseapp.com",
            projectId: "core-ranker",
            storageBucket: "core-ranker.firebasestorage.app",
            messagingSenderId: "13358547173",
            appId: "1:13358547173:web:fe232275125be8e884940c",
            measurementId: "G-038M2NDM0T"
        };

        // 3. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 4. Handle the Login Button Click
        const loginForm = document.getElementById('login-form');
        
        loginForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Stops page refresh

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Check Firebase to see if they exist
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Success! Let them in.
                    window.location.href = "dashboard.html"; // Send them to the study dashboard
                })
                .catch((error) => {
                    // Failed (Wrong password or email)
                    alert("Login failed: Check your email and password.");
                });
        });
    </script>

</body>
</html>

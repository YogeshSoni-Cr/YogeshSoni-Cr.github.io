<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Core Ranker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen py-10">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-600 tracking-wider">Core Ranker</h1>
            <p class="text-gray-500 mt-2">Create your free account to start preparing.</p>
        </div>

        <form id="signup-form">
            
            <div class="mb-4">
                <label for="name" class="block text-gray-700 font-semibold mb-2">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Rahul Kumar" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>

            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email Address</label>
                <input type="email" id="email" name="email" placeholder="student@example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>

            <div class="mb-4">
                <label for="phone" class="block text-gray-700 font-semibold mb-2">Mobile Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+91 xxxxx xxxxx" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-gray-700 font-semibold mb-2">Create Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                Create Account
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-gray-600">Already have an account? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Log in here</a></p>
        </div>

        <div class="text-center mt-8">
            <a href="index.html" class="text-gray-400 hover:text-gray-600 text-sm">← Back to Home</a>
        </div>
        
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { initializeFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
    
        const firebaseConfig = {
            apiKey: "AIzaSyDENuRhO2xK9hZK43kFVHmbZR3rz6LHjAY",
            authDomain: "core-ranker.firebaseapp.com",
            projectId: "core-ranker",
            storageBucket: "core-ranker.firebasestorage.app",
            messagingSenderId: "13358547173",
            appId: "1:13358547173:web:fe232275125be8e884940c",
            measurementId: "G-038M2NDM0T"
        };
    
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // Force long polling to prevent connection hangs
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });
    
        const signupForm = document.getElementById('signup-form');
        
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Creating Account...";
    
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
    
            try {
                // Step 1: Create Auth User
                const res = await createUserWithEmailAndPassword(auth, email, password);
                
                // Step 2: Save to Firestore
                await setDoc(doc(db, "users", res.user.uid), {
                    name: name,
                    phone: phone,
                    email: email,
                    branch: "Mechanical",
                    target: "GATE 2025",
                    createdAt: new Date()
                });
    
                alert("Registration Successful!");
                window.location.href = "dashboard.html";
    
            } catch (err) {
                console.error(err);
                alert("Signup Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Create Account";
            }
        });
    </script>

    
</body>
</html>
